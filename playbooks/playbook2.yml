---
- name: instalar mysql y configurar base de datos
  hosts: ubuntu
  become: yes
  vars:
    ansible_python_interpreter: auto_silent

  tasks:

  - name: Actualizar SO para distribución de familia Red Hat
    ansible.builtin.dnf:
      name: '*'
      state: latest
    when: ansible_os_family=='RedHat'
  
  - name: Actualizar SO para distribución de familia Debian
    ansible.builtin.apt:
      name: '*'
      state: latest
    when: ansible_os_family=='Debian'

  - name: instalar mariadb service
    ansible.builtin.apt:
      name: mariadb-server
      state: latest
      update_cache: yes

  - name: Asegurar el servicio Mariadb con mysql_secure_installation
    ansible.builtin.expect:
      command: mysql_secure_installation
      responses:
        'Enter current password for root': ''
        'Switch to unix_socket authentication': 'n' 
        'Change the root password': 'y'
        'New password': '{{ mysql_root_password }}'
        'Re-enter new password': '{{ mysql_root_password }}'
        'Remove anonymous users': 'y'
        'Disallow root login remotely': 'y'
        'Remove test database and access to it': 'y'
        'Reload privilege tables now': 'y'
      timeout: 1

  - name: Instalar pymysql requerido para interacción con base de datos (Debian)
    ansible.builtin.apt:
      name: python3-pymysql
      state: present
    when: ansible_os_family=='Debian'
  
  - name: Instalar pymysql requerido para interacción con base de datos (Debian)
    ansible.builtin.dnf:
      name: python3-pymysql
      state: present
    when: ansible_os_family=='RedHat'
  
  - name: Permitir que MariaDB escuche en la red (no solo localhost)
    ansible.builtin.lineinfile:
      path: /etc/mysql/mariadb.conf.d/50-server.cnf
      line: bind-address            = 0.0.0.0
      regexp: '^bind-address'

  - name: Reiniciar mariadb
    ansible.builtin.systemd_service:
      name: mariadb
      state: restarted

  - name: Crear base de datos de la app
    community.mysql.mysql_db:
      name: '{{ db_name }}'
      state: present
      login_user: root
      login_password: '{{ mysql_root_password }}'

  - name: Crear usuario de la app, solo habilitado a conectarse desde su servidor
    community.mysql.mysql_user:
      login_user: root
      login_password: '{{ mysql_root_password }}'
      state: present
      name: '{{ db_user }}'
      password: '{{ db_password }}'
      host: '{{ app_server_ip }}'
      column_case_sensitive: false

  - name: Crear tablas de usuarios y tareas y luego dar permisos sobre la misma al usuario de la app
    community.mysql.mysql_query:
      login_user: root
      login_password: '{{ mysql_root_password }}'
      login_db: '{{ db_name }}'
      query:
      - CREATE TABLE IF NOT EXISTS `users` ( `id` int(3) NOT NULL AUTO_INCREMENT, `first_name` varchar(20) DEFAULT NULL, `last_name` varchar(20) DEFAULT NULL, `username` varchar(250) DEFAULT NULL, `password` varchar(20) DEFAULT NULL, PRIMARY KEY (`id`) ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_general_ci;
      - CREATE TABLE IF NOT EXISTS `todos` ( `id` bigint(20) NOT NULL AUTO_INCREMENT, `description` varchar(255) DEFAULT NULL, `is_done` bit(1) NOT NULL, `target_date` datetime(6) DEFAULT NULL, `username` varchar(255) DEFAULT NULL, `title` varchar(255) DEFAULT NULL, PRIMARY KEY (`id`) ) ENGINE=InnoDB AUTO_INCREMENT=8 DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_general_ci;
      - "GRANT ALL PRIVILEGES ON {{ db_name }}.* TO '{{ db_user }}'@'{{ app_server_ip }}' IDENTIFIED BY '{{ db_password }}';"
      - FLUSH PRIVILEGES;


  - name: Habilitar tráfico de SSH
    community.general.ufw:
      rule: allow
      name: OpenSSH

  - name: Habilitar tráfico a través del puerto de MariaDB solo desde el servidor de la app
    community.general.ufw:
      rule: allow
      src: '{{ app_server_ip }}'
      port: '{{ mysql_port }}'
...

